# Reindeer configuration for antlir third-party Rust crates

third_party_dir = "."

precise_srcs = true

license_patterns = ["LICENSE*", "COPYING*", "UNLICENSE*"]

include_top_level = true

# Do not vendor - use http_archive to download from crates.io
vendor = false

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"

[platform.linux-riscv64]
target = "riscv64gc-unknown-linux-gnu"

[platform.macos-x86_64]
target = "x86_64-apple-darwin"

[platform.macos-arm64]
target = "aarch64-apple-darwin"

[platform.windows-gnu]
target = "x86_64-pc-windows-gnu"

[platform.windows-msvc]
target = "x86_64-pc-windows-msvc"

[platform.wasi]
target = "wasm32-wasip1"

[platform.wasm32]
target = "wasm32-unknown-unknown"

[cargo]

[buck]
file_name = "BUCK"

rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
cxx_library = "third_party_rust_cxx_library"
prebuilt_cxx_library = "third_party_rust_prebuilt_cxx_library"
buildscript_genrule = "buildscript_run"

buckfile_imports = """
load("@prelude//rust:cargo_package.bzl", "cargo")
load(":defs.bzl", "third_party_rust_cxx_library", "buildscript_run")
"""

generated_file_header = """
# @generated by `reindeer buckify`
"""
